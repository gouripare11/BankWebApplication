<body>

        <ul type="none">
            <li><i class="fa-solid fa-building-columns" style="color: rgb(18, 18, 114); font-size: 50px;"></i></li>

                <li id="l"><a href="Login.html">Login</a></li>
        </ul>

    <hr>
    <div class="a">
        <div class="sub">
            <form action="CreateAccController">
            <p align="center">Create Account</p><br>
                <table align="center" border="0" cellspacing="0" cellpadding="0">
                    <tr>
                        <td>Account No.</td>
                        <td><input type="text" name="accno" placeholder="account no"><br><br></td>
                    </tr>
                    <tr>
                        <td>Customer Name</td>
                        <td><input type="text" name="cname" placeholder="customer name"><br><br></td>
                    </tr>
                    <tr>
                        <td>Balance</td>
                        <td><input type="text" name="bal" placeholder="balance"><br><br></td>
                    </tr>
                    <tr>
                        <td>User ID</td>
                        <td><input type="text" name="uid" placeholder="user id"><br><br></td>
                    </tr>
                    <tr>
                        <td>User Name</td>
                        <td><input type="text" name="username" placeholder="user name"><br><br></td>
                    </tr>
                    <tr>
                        <td>Password</td>
                        <td><input type="password" name="password" placeholder="password"><br><br></td>
                    </tr>
                </table><br><br>
                <button id="login">Create Account</button>
            </form>
        </div>
    </div>
