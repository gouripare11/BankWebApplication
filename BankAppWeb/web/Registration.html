<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>
    <link rel="stylesheet" href="Registration.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="main">
        <nav class="nav">
            <ul type="none">
                <li><i class="fa-solid fa-building-columns" style="color: rgb(18, 18, 114); font-size: 50px;"></i></li>
                <li style="font-size: 28px; ">Welcome to our Banking System </li>
            </ul>
        </nav>
        
    </div>

    <div class="a">
        <div class="sub">
            <form action="RController" method="post">
                <table align="center" border="0" cellspacing="0" cellpadding="20">
                    <tr>
                        <td>Name</td>
                        <td><input type="text" name="name" placeholder="name"></td>
                    </tr>
                    <tr>
                        <td>UserName</td>
                        <td><input type="text" name="username" placeholder="username"></td>
                    </tr>
                    <tr>
                        <td>Password</td>
                        <td><input type="password" name="password" placeholder="password"></td>
                    </tr>
                </table><br>
                <button id="login">Signup</button>
                <p>Already registered ?<a href="Login.html">Login</a></p>
            </form>
        </div>
    </div>
</body>
</html>
